services:
  postgres:
    image: postgres:16-alpine
    container_name: family-tree-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_tree_app
      POSTGRES_USER: family_tree
      POSTGRES_PASSWORD: family_tree_password
    ports:
      - "5433:5432"
    volumes:
      - family_tree_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_tree -d family_tree_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  family_tree_postgres_data:
